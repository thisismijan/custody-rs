[package]
name = "gateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
sfv = "0.16.1"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
base64 = "0.23.1"
http-body-util = "0.1.5"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
