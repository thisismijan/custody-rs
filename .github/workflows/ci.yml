name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Read the pinned toolchain channel
        run: |
          channel=$(bash ci/toolchain-channel.sh rust-toolchain.toml)
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Install cargo-deny
        working-directory: ${{ runner.temp }}
        run: cargo install --locked cargo-deny@0.22.0
      - name: Run the checks
        run: bash ci/check.sh .
